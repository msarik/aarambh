                            <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Educational WebApp</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #000000;
      transition: background-color 0.3s, color 0.3s;
    }
    .dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: #007BFF;
      color: white;
    }
    .header-title {
      font-size: 24px;
      font-weight: bold;
    }
    main {
      padding: 20px;
      margin-left: 80px; /* Space for the vertical navbar */
    }
    .assignment {
      margin-bottom: 20px;
    }
    .toggle-container {
      display: flex;
      align-items: center;
    }
    .toggle-container label {
      margin-left: 10px;
      font-size: 16px;
    }
    footer {
      text-align: center;
      padding: 10px;
      background-color: #007BFF;
      color: white;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    .navbar {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      background-color: #007BFF;
      position: fixed;
      left: 0;
      top: 0;
      height: 100%;
      width: 80px;
      padding: 20px 0;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 15px 0;
    }
    .navbar a:hover {
      text-decoration: underline;
    }
    .navbar svg {
      width: 24px;
      height: 24px;
      fill: white;
    }
    .notification-count {
      position: absolute;
      top: 5px;
      right: 10px;
      background-color: red;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">Aarambh Study</div>
    <div class="toggle-container">
      <label for="darkModeToggle">Dark Mode</label>
      <input type="checkbox" id="darkModeToggle">
    </div>
  </header>
  <nav class="navbar">
    <a href="#">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <a href="#">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm0 18H6V4h2v8h6v8zm4-10H8v-2h8v2zm0-4H8V6h8v2z"/></svg>
      PDF
    </a>
    <a href="#">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
      Notifications
      <span class="notification-count">3</span>
    </a>
    <a href="#">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Profile
    </a>
  </nav>
  <main>
    <div class="assignment">
      <h2>Assignment 1</h2>
      <p>Complete the exercises from Chapter 1.</p>
      <a href="https://example.com/assignment1.pdf" target="_blank">Download PDF</a>
    </div>
    <div class="assignment">
      <h2>Assignment 2</h2>
      <p>Submit your project proposal by Friday.</p>
      <a href="https://example.com/assignment2.pdf" target="_blank">Download PDF</a>
    </div>
  </main>
  <footer>
    &copy; 2023 Educational WebApp
  </footer>
  <script>
    const darkModeToggle = document.getElementById('darkModeToggle');
    const body = document.body;

    darkModeToggle.addEventListener('change', () => {
      body.classList.toggle('dark-mode');
    });
  </script>
</body>
</html>
